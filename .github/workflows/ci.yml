name: CI
on:
  push: { branches: [main] }
  pull_request:
# a new push to the same branch supersedes the running workflow: cancel it cleanly instead of
# letting it finish or fail (cancelled runs do not count as failures)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          sudo apt-get install -y clang-format
          find include src tests python/bindings -name '*.hpp' -o -name '*.cpp' | xargs clang-format --dry-run -Werror

  build-test:
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          # HPFEM_ENABLE_CUDA only compiles the run-time loader of the GPU solver library;
          # without the DLL and a GPU the backend reports itself unavailable (no CUDA needed)
          - { os: ubuntu-24.04, cc: gcc-13,  cxx: g++-13,     preset: release,
              configure: "-DHPFEM_ENABLE_CUDA=ON" }
          - { os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: release,
              extra: "libomp-18-dev" }
          - { os: ubuntu-24.04, cc: gcc-13,  cxx: g++-13,     preset: asan }
          - { os: ubuntu-24.04, cc: gcc-13,  cxx: g++-13,     preset: mumps,
              extra: "libmumps-seq-dev libmumps-headers-dev" }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev ${{ matrix.cxx }} ${{ matrix.extra }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.configure }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  clang-tidy:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev clang-tidy-18 libomp-18-dev
      - run: cmake --preset debug
      - run: |
          # only the sources of this configuration (optional backends are not in the database)
          files=$(python3 -c "import json; print(' '.join(sorted({e['file'] for e in json.load(open('build/debug/compile_commands.json')) if '/src/' in e['file'].replace(chr(92), '/')})))")
          [ -z "$files" ] || clang-tidy-18 -p build/debug $files

  python:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev libglu1-mesa libxcursor1 libxft2 libxinerama1 libxrender1
      - run: pip install ".[dev]" -v
      - run: pytest python/tests
