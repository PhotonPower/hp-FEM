name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          sudo apt-get install -y clang-format
          find include src tests -name '*.hpp' -o -name '*.cpp' | xargs clang-format --dry-run -Werror

  build-test:
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc-13,  cxx: g++-13,     preset: release }
          - { os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: release }
          - { os: ubuntu-24.04, cc: gcc-13,  cxx: g++-13,     preset: asan }
    runs-on: ${{ matrix.os }}
    env: { CC: ${{ matrix.cc }}, CXX: ${{ matrix.cxx }} }
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev ${{ matrix.cxx }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  clang-tidy:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev clang-tidy-18
      - run: cmake --preset debug
      - run: |
          files=$(find src -name '*.cpp')
          [ -z "$files" ] || clang-tidy-18 -p build/debug $files

  python:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev
      - run: pip install ".[dev]" -v
      - run: pytest python/tests
