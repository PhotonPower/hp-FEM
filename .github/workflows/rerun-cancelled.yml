# Re-runs CI jobs that were cancelled (runner shortage) so that auto-merge is not left waiting
# on a run that would never turn green. Runs with a genuinely failed job and runs superseded by
# a newer push are left alone; at most three attempts per run.
name: Rerun cancelled jobs
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  actions: write
jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - name: Re-run the cancelled jobs when nothing failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          if [ "$ATTEMPT" -ge 4 ]; then echo "attempt $ATTEMPT: giving up"; exit 0; fi
          latest=$(gh run list --workflow CI --branch "$BRANCH" --event "$EVENT" --limit 1 --json headSha --jq '.[0].headSha')
          if [ "$latest" != "$HEAD_SHA" ]; then echo "superseded by $latest, not re-running"; exit 0; fi
          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")
          failed=$(echo "$jobs" | jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out")] | length')
          cancelled=$(echo "$jobs" | jq '[.jobs[] | select(.conclusion == "cancelled")] | length')
          echo "run $RUN_ID attempt $ATTEMPT: $failed failed, $cancelled cancelled"
          if [ "$failed" -ne 0 ] || [ "$cancelled" -eq 0 ]; then echo "nothing to re-run"; exit 0; fi
          gh run rerun "$RUN_ID" --failed
