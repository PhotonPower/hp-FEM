[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "hpfem"
version = "0.5.0"
description = "Adaptive hp-FEM suite for nano-optics (time-harmonic Maxwell)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "KF" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = [
  "finite elements", "hp-FEM", "Maxwell", "nano-optics", "photonics", "Nedelec",
  "adaptivity", "PML", "gratings", "scatterometry", "elasticity",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/PhotonPower/hp-FEM"
Documentation = "https://photonpower.github.io/hp-FEM/"
"LLM reference" = "https://github.com/PhotonPower/hp-FEM/blob/main/python/hpfem/llm_reference.md"
Changelog = "https://github.com/PhotonPower/hp-FEM/blob/main/CHANGELOG.md"
Issues = "https://github.com/PhotonPower/hp-FEM/issues"

[project.scripts]
hpfem = "hpfem.cli:main"
hpfem-gui = "hpfem.gui:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit", "meshio", "matplotlib", "pyyaml", "gmsh", "emcee"]
meshing = ["gmsh"]
yaml = ["pyyaml"]
gui = ["streamlit>=1.30", "gmsh", "matplotlib", "meshio", "pyyaml"]
docs = ["mkdocs-material", "pymdown-extensions"]
# hpfem.opt: multi-objective and multi-fidelity Bayesian optimisation (experimental)
opt-bo = ["botorch>=0.10"]
# hpfem.opt: MCMC sampling of the parameter posterior (hpfem.opt.sample)
opt-mcmc = ["emcee>=3.1"]

[tool.scikit-build]
# distribution builds: warnings of other compiler versions must not stop an installation
cmake.args = ["-DHPFEM_BUILD_PYTHON=ON", "-DHPFEM_BUILD_TESTS=OFF", "-DHPFEM_BUILD_EXAMPLES=OFF", "-DHPFEM_WARNINGS_AS_ERRORS=OFF"]
cmake.build-type = "Release"
wheel.packages = ["python/hpfem"]
sdist.exclude = ["build/", "benchmarks/results/", "docs/", "examples/*/output/", "site/", ".claude/", ".github/"]

# wheels (M15 F15, .github/workflows/wheels.yml): SparseLU build, self-contained; the direct
# solver backends MUMPS and cuDSS stay with the source build (licence and size)
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 *-win32 pp*"
build-verbosity = 1
test-requires = ["pytest", "scipy"]
test-command = "pytest {project}/python/tests/test_gui_entry.py {project}/python/tests/test_progress.py {project}/python/tests/test_reference.py -q"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]

# macOS arm64 with Apple Clang and the Homebrew libomp (bundled into the wheel by delocate);
# the deployment target is that of the libomp bottle on the macos-15 runner (wheels.yml)
[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "brew install libomp"
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0", CMAKE_ARGS = "-DOpenMP_ROOT=$(brew --prefix libomp)" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]  # notebooks keep their interactive style
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
[tool.ruff.lint.isort]
known-first-party = ["hpfem"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
