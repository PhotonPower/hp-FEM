[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "hpfem"
version = "0.3.0"
description = "Adaptive hp-FEM suite for nano-optics (time-harmonic Maxwell)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
hpfem = "hpfem.cli:main"
hpfem-gui = "hpfem.gui:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit", "meshio", "matplotlib", "pyyaml", "gmsh"]
meshing = ["gmsh"]
yaml = ["pyyaml"]
gui = ["streamlit>=1.30", "gmsh", "matplotlib", "meshio", "pyyaml"]
docs = ["mkdocs-material", "pymdown-extensions"]

[tool.scikit-build]
# distribution builds: warnings of other compiler versions must not stop an installation
cmake.args = ["-DHPFEM_BUILD_PYTHON=ON", "-DHPFEM_BUILD_TESTS=OFF", "-DHPFEM_BUILD_EXAMPLES=OFF", "-DHPFEM_WARNINGS_AS_ERRORS=OFF"]
cmake.build-type = "Release"
wheel.packages = ["python/hpfem"]
sdist.exclude = ["build/", "benchmarks/results/", "docs/", "examples/*/output/", "site/", ".claude/", ".github/"]

# wheels (M15 F15, .github/workflows/wheels.yml): SparseLU build, self-contained; the direct
# solver backends MUMPS and cuDSS stay with the source build (licence and size)
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 *-win32 pp*"
build-verbosity = 1
test-requires = ["pytest", "scipy"]
test-command = "pytest {project}/python/tests/test_gui_entry.py {project}/python/tests/test_progress.py -q"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]  # notebooks keep their interactive style
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
[tool.ruff.lint.isort]
known-first-party = ["hpfem"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
